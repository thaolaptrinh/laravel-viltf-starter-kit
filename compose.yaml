x-app-base: &app-base
    image: ${IMAGE:-ghcr.io/${GH_REPO:-thaolaptrinh/laravel-viltf}:${IMAGE_TAG:-dev}}
    networks: [stack]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
        driver: json-file
        options: { max-size: '50m', max-file: '10', compress: 'true' }
    depends_on:
        pgsql: { condition: service_healthy }
        redis: { condition: service_healthy }
    volumes:
        - .:/var/www/html
        - /var/www/html/vendor
        - /var/www/html/node_modules
        - /var/www/html/public/build
        - /var/www/html/storage/ssr

x-data-healthcheck: &data-hc
    interval: 5s
    timeout: 3s
    retries: 10

services:
    app:
        <<: *app-base
        profiles: [dev, staging, production, testing]
        build:
            context: .
            dockerfile: Dockerfile
            target: ${BUILD_TARGET:-dev}
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
                TZ: ${TZ:-UTC}
        command:
            [
                'php',
                'artisan',
                'octane:frankenphp',
                '--host=0.0.0.0',
                '--port=8000',
            ]
        ports:
            - '${APP_PORT:-8080}:8000'
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/up || exit 1']
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 30s

    horizon:
        <<: *app-base
        profiles: [dev, staging, production, testing]
        command: ['php', 'artisan', 'horizon']
        stop_grace_period: 3600s

    scheduler:
        <<: *app-base
        profiles: [staging, production]
        command: ['supercronic', '/etc/supercronic/laravel']

    ssr:
        <<: *app-base
        profiles: [staging, production]
        command:
            ['php', 'artisan', 'inertia:start-ssr', '--runtime=node', '--quiet']

    reverb:
        <<: *app-base
        profiles: [staging, production]
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ulimits:
            nofile: { soft: 65536, hard: 65536 }

    pgsql:
        image: postgres:18-alpine
        profiles: [dev, staging, production, testing]
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - stack-pgsql:/var/lib/postgresql
            - ./docker/postgres/postgresql.conf:/var/lib/postgresql/postgresql.conf:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}',
                ]
            <<: *data-hc
        networks: [stack]
        restart: unless-stopped
        security_opt: [no-new-privileges:true]
        logging:
            { driver: json-file, options: { max-size: '50m', max-file: '10' } }

    redis:
        image: redis:7-alpine
        profiles: [dev, staging, production, testing]
        command:
            - redis-server
            - --requirepass
            - ${REDIS_PASSWORD:-}
            - --maxmemory
            - ${REDIS_MAXMEMORY:-256mb}
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - '60 10000'
            - --save
            - '300 10'
            - --appendonly
            - 'yes'
        volumes:
            - stack-redis:/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "${REDIS_PASSWORD:-}" ping 2>/dev/null || redis-cli ping',
                ]
            <<: *data-hc
        networks: [stack]
        restart: unless-stopped
        security_opt: [no-new-privileges:true]
        logging:
            { driver: json-file, options: { max-size: '50m', max-file: '10' } }

networks:
    stack:
        driver: bridge

volumes:
    stack-pgsql:
        name: ${VOLUME_PREFIX:-stack}-pgsql
    stack-redis:
        name: ${VOLUME_PREFIX:-stack}-redis
