# Auto-loaded by `docker compose up` for dev environment.
# Vite is a separate service (not supervisor child) for log isolation + independent restart.
# Personal local tweaks: use compose.override.local.yml (gitignored).
services:
    app:
        environment:
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
            IGNITION_LOCAL_SITES_PATH: ${PWD}

    vite:
        profiles: [dev]
        image: ${IMAGE:-ghcr.io/${GH_REPO:-thaolaptrinh/laravel-viltf}:${IMAGE_TAG:-dev}}
        working_dir: /var/www/html
        command: ['pnpm', 'dev', '--host']
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        networks: [stack]
        restart: unless-stopped
