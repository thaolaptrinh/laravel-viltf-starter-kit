# Testing overrides — used by CI and `make test`.
# Separate DB, sync queue, array cache. Source mounts from CI workspace.
# Usage:
#   make test
#   make test CMD="--filter=UserTest"
# CI:  docker compose -f compose.yaml -f compose.testing.yml up -d --wait pgsql redis
#      docker compose -f compose.yaml -f compose.testing.yml run --rm app php artisan test --parallel

services:
  app:
    environment:
      APP_ENV: testing
      DB_DATABASE: testing
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
      BROADCAST_CONNECTION: 'null'
      WITH_VITE: 'false'

  pgsql:
    environment:
      POSTGRES_DB: testing
