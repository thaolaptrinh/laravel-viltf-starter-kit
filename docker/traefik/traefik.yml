global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  app:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: app-secure
          scheme: https
          permanent: true
  app-secure:
    address: ':443'
    http3:
      advertisedPort: 443
    transport:
      lifeCycle:
        graceTimeOut: 30s
  traefik:
    address: ':8080'

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: stack
  file:
    filename: /etc/traefik/dynamic.yml

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: traefik

log:
  level: ERROR
  format: common

accessLog:
  format: common

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
