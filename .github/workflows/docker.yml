name: Build & Deploy (optional fallback — primary CI is local via Makefile)

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: app:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start deps (pgsql + redis)
        env:
          IMAGE: app:dev-test
          USER_ID: '1000'
          GROUP_ID: '1000'
          DB_DATABASE: testing
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up -d --wait pgsql redis

      - name: Composer validate
        env:
          IMAGE: app:dev-test
        run: docker compose run --rm app composer validate --no-check-publish

      - name: Lint (Pint + Rector dry-run)
        env:
          IMAGE: app:dev-test
        run: docker compose run --rm app composer test:lint

      - name: Types (PHPStan)
        env:
          IMAGE: app:dev-test
        run: docker compose run --rm app composer test:types

      - name: Pest tests
        env:
          IMAGE: app:dev-test
          DB_DATABASE: testing
          QUEUE_CONNECTION: sync
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm app php artisan test --testsuite=Unit --testsuite=Feature --parallel

      - name: Verify frontend build
        env:
          IMAGE: app:dev-test
        run: docker compose run --rm app pnpm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64' }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/app
            docker compose -f compose.yaml -f compose.staging.yaml pull
            docker rollout -f compose.yaml -f compose.staging.yaml app
            docker rollout -f compose.yaml -f compose.staging.yaml horizon
            docker rollout -f compose.yaml -f compose.staging.yaml ssr
            docker rollout -f compose.yaml -f compose.staging.yaml reverb
            docker compose -f compose.yaml -f compose.staging.yaml up -d --remove-orphans scheduler traefik
            docker image prune -f

  deploy-production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/app
            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker rollout -f compose.yaml -f compose.prod.yaml app
            docker rollout -f compose.yaml -f compose.prod.yaml horizon
            docker rollout -f compose.yaml -f compose.prod.yaml ssr
            docker rollout -f compose.yaml -f compose.prod.yaml reverb
            docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans scheduler traefik
            docker image prune -f
