version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      composer-prod:
        dependency-type: 'production'
        patterns:
          - '*'
      composer-dev:
        dependency-type: 'development'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
